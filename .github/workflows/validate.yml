name: validate

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate Skill structure
        run: python life-model-writing/scripts/validate_skill.py life-model-writing
      - name: Run standard-library tests
        run: python -m unittest discover -s life-model-writing/tests -v
