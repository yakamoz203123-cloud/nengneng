name: picturebook skill

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: make-kids-picturebooks/requirements.txt

      - name: Install skill dependencies
        run: python -m pip install -r make-kids-picturebooks/requirements.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Compile scripts
        run: python -m compileall make-kids-picturebooks/scripts

      - name: Run tests
        run: python -X utf8 -W error::DeprecationWarning -m unittest discover -s make-kids-picturebooks/tests -q

      - name: Build hosted skill archive
        run: python -X utf8 make-kids-picturebooks/scripts/package_skill.py make-kids-picturebooks package-ci.zip --version 0.9.1

      - name: Check archive exists
        shell: bash
        run: test -s package-ci.zip
